<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>The Battle</title>
<style>
  :root {
    --left-width: 50%;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 2000px;
    height: 1000px;
    font-family: Arial, Helvetica, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
  }

  /* Main grid: left column | splitter | right column */
  #main-grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: var(--left-width) 6px 1fr;
    min-height: 0;
  }
  #left-column {
    display: grid;
    grid-template-rows: 1fr 1fr 1fr;
    min-height: 0;
  }
  #left-column iframe:not(:last-child) {
    border-bottom: 2px solid #ccc;
  }
  #splitter {
    cursor: col-resize;
    background: #ccc;
  }
  #splitter:hover { background: #999; }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>

  <div id="main-grid">
    <div id="left-column">
      <iframe id="frame1" name="frame1" src="https://keepthescore.com/scoreboard/slgnvdkwvspwr/"></iframe>
      <iframe id="frame2" name="frame2" src="https://keepthescore.com/scoreboard/lptyzzlxmjhjr/"></iframe>
      <iframe id="frame3" name="frame3" src="https://keepthescore.com/scoreboard/twqjxvlxydcmr/"></iframe>
    </div>
    <div id="splitter"></div>
    <iframe id="frame4" name="frame4" src="https://keepthescore.com/board/gmrbyqfskcyqr/?public=true"></iframe>
  </div>

<script>
  (function () {
    // Splitter drag logic
    const mainGrid = document.getElementById('main-grid');
    const splitter = document.getElementById('splitter');
    let dragging = false;

    splitter.addEventListener('mousedown', () => {
      dragging = true;
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      const rect = mainGrid.getBoundingClientRect();
      let percent = ((e.clientX - rect.left) / rect.width) * 100;
      percent = Math.min(85, Math.max(15, percent));
      mainGrid.style.setProperty('--left-width', percent + '%');
    });

    document.addEventListener('mouseup', () => {
      dragging = false;
      document.body.style.userSelect = '';
    });
  })();
</script>

</body>
</html>
